<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Milkrun 2026-08-17</title>
<style>
  body { margin:0; padding:16px; background:#1e2229; color:#b0b8c8;
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th { background:#1e2229; color:#8b949e; font-size:11px; font-weight:700;
        padding:8px 6px; text-align:center; border-bottom:1px solid #2d323c; }
  td { padding:6px; text-align:center; border-bottom:1px solid #2d323c; font-size:12px; }
  td.left { text-align:left; }
  .order-qty { color:#7db4f5; font-weight:700; }
  .btn-edit { background:#2d3540; color:#7db4f5; border:1px solid #2d323c;
               border-radius:4px; padding:3px 8px; font-size:10px; cursor:pointer; }
  .group-select { background:#22262e; color:#b0b8c8; border:1px solid #2d323c;
                   border-radius:4px; padding:2px 4px; font-size:10px; }
</style></head>
<body><div style="padding:40px;text-align:center;color:#6b7280;">2026-08-17 기준 이동중인 발주가 없습니다</div>
<script>
document.addEventListener('click', function(e) {
  if (e.target && e.target.classList.contains('btn-edit')) {
    if (window.parent && window.parent.markEdit) window.parent.markEdit(e);
  }
});
document.addEventListener('change', function(e) {
  if (e.target && e.target.classList.contains('group-select')) {
    if (window.parent && window.parent.assignGroup) window.parent.assignGroup(e.target);
  }
});
</script>
</body></html>
